<style>

#lanecard .c3{left:-1px;bottom:-1px;border-bottom-width:2px;border-left-width:2px}#lanecard .c4{right:-1px;bottom:-1px;border-bottom-width:2px;border-right-width:2px}

#lanecard .ab{font-size:14px;line-height:1.5;color:#bbb}
#lanecard .lad{margin-top:14px;border-top:1px solid #222;padding-top:10px;display:grid;gap:5px}
#lanecard .row{display:grid;grid-template-columns:150px 1fr;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#666}

.card .ft span{cursor:pointer;color:#aaa;text-decoration:underline dotted}
.card .x{position:absolute;right:14px;top:6px;color:#777;cursor:pointer;font-size:22px;z-index:2}

 return along(c.lane,band(c.step)+bandH(c.step)*(i+1)/(n.length+1))}

{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<2500;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(80+Math.random()*120);p.push(v.x,v.y,v.z)}

 LANES.forEach(l=>{sweep('вкладка '+l.id,()=>tab(l.id),l.id);sweep('карточка ветки '+l.id,()=>openLane(l.id),l.id)});
 // tab wins over a lane card of another lane
 sweep('вкладка plan + карточка ветки pr',()=>{tab('plan');openLane('pr')},'plan');
 const pre=document.createElement('pre');pre.id='navtest';pre.textContent=out.join('\n')+`\n${out.every(s=>s.startsWith('PASS'))?'PASS':'FAIL'}: ${out.length} проходов`;document.body.appendChild(pre)},800);
// test hook: ?press=ArrowRight,ArrowLeft replays keys after load
if(qs.has('press'))setTimeout(()=>qs.get('press').split(',').forEach(k=>dispatchEvent(new KeyboardEvent('keydown',{key:k}))),600);
</script></body></html>
